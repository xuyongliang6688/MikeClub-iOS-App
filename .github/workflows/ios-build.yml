name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned iOS package
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Generate app icons
        run: swift Scripts/generate_app_icons.swift

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project MikeClub.xcodeproj \
            -scheme MikeClub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/MikeClub.app"
          test -d "$APP_PATH"
          rm -rf build/Payload build/MikeClub-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry MikeClub-unsigned.ipa Payload)

      - name: Build simulator app
        run: |
          set -euo pipefail
          xcodebuild \
            -project MikeClub.xcodeproj \
            -scheme MikeClub \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            clean build
          ditto -c -k --keepParent \
            build/SimulatorDerivedData/Build/Products/Release-iphonesimulator/MikeClub.app \
            build/MikeClub-simulator-app.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MikeClub-iOS-build
          path: |
            build/MikeClub-unsigned.ipa
            build/MikeClub-simulator-app.zip
          if-no-files-found: error
